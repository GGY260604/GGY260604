<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Retro runner animation</title>
  <desc id="desc">A small retro character keeps running and jumps over moving obstacles.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#334155" stroke-width="1" opacity="0.35"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .track { animation: slide 3.4s linear infinite; }
    .obstacle { animation: obstacleMove 2.2s linear infinite; }
    .runner { animation: jump 2.2s ease-in-out infinite; transform-origin: 150px 110px; }
    .leg-a { animation: legA .28s steps(2) infinite; transform-origin: 145px 120px; }
    .leg-b { animation: legB .28s steps(2) infinite; transform-origin: 168px 120px; }
    .arm-a { animation: armA .28s steps(2) infinite; transform-origin: 138px 90px; }
    .arm-b { animation: armB .28s steps(2) infinite; transform-origin: 173px 92px; }
    .coin { animation: coinFloat 1.2s ease-in-out infinite alternate; }
    .blink { animation: blink 1.8s ease-in-out infinite; }

    @keyframes slide {
      from { transform: translateX(0); }
      to { transform: translateX(-72px); }
    }
    @keyframes obstacleMove {
      from { transform: translateX(870px); }
      to { transform: translateX(-160px); }
    }
    @keyframes jump {
      0%, 58%, 100% { transform: translateY(0); }
      70% { transform: translateY(-54px); }
      80% { transform: translateY(-54px); }
    }
    @keyframes legA {
      0% { transform: rotate(18deg); }
      100% { transform: rotate(-20deg); }
    }
    @keyframes legB {
      0% { transform: rotate(-22deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes armA {
      0% { transform: rotate(-18deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes armB {
      0% { transform: rotate(20deg); }
      100% { transform: rotate(-18deg); }
    }
    @keyframes coinFloat {
      from { transform: translateY(0); opacity: .75; }
      to { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes blink {
      0%, 40%, 100% { opacity: 1; }
      50%, 60% { opacity: .25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .track, .obstacle, .runner, .leg-a, .leg-b, .arm-a, .arm-b, .coin, .blink { animation: none; }
    }
  </style>

  <rect width="1000" height="180" rx="22" fill="url(#sky)"/>
  <rect width="1000" height="180" rx="22" fill="url(#grid)"/>

  <g opacity="0.55" filter="url(#glow)">
    <circle cx="850" cy="38" r="3" fill="#93c5fd" class="blink"/>
    <circle cx="765" cy="66" r="2" fill="#facc15"/>
    <circle cx="615" cy="36" r="3" fill="#a78bfa"/>
    <circle cx="470" cy="58" r="2" fill="#67e8f9"/>
    <circle cx="330" cy="40" r="2" fill="#f472b6"/>
    <circle cx="245" cy="70" r="2" fill="#93c5fd"/>
  </g>

  <g class="coin" filter="url(#glow)">
    <circle cx="675" cy="108" r="12" fill="#facc15"/>
    <rect x="673" y="99" width="4" height="18" rx="2" fill="#92400e" opacity="0.65"/>
  </g>

  <g transform="translate(0, 0)">
    <g class="track">
      <rect x="0" y="142" width="1072" height="8" fill="#22c55e"/>
      <rect x="0" y="150" width="1072" height="18" fill="#166534"/>
      <g fill="#84cc16" opacity="0.8">
        <rect x="18" y="132" width="36" height="10"/>
        <rect x="108" y="132" width="36" height="10"/>
        <rect x="198" y="132" width="36" height="10"/>
        <rect x="288" y="132" width="36" height="10"/>
        <rect x="378" y="132" width="36" height="10"/>
        <rect x="468" y="132" width="36" height="10"/>
        <rect x="558" y="132" width="36" height="10"/>
        <rect x="648" y="132" width="36" height="10"/>
        <rect x="738" y="132" width="36" height="10"/>
        <rect x="828" y="132" width="36" height="10"/>
        <rect x="918" y="132" width="36" height="10"/>
      </g>
    </g>
  </g>

  <g class="obstacle">
    <rect x="0" y="106" width="42" height="36" rx="4" fill="#ef4444"/>
    <rect x="7" y="96" width="28" height="10" rx="3" fill="#f97316"/>
    <rect x="8" y="114" width="9" height="9" fill="#7f1d1d" opacity="0.45"/>
    <rect x="25" y="127" width="9" height="9" fill="#7f1d1d" opacity="0.45"/>
  </g>

  <g class="runner" filter="url(#glow)">
    <!-- shadow -->
    <ellipse cx="157" cy="145" rx="38" ry="7" fill="#020617" opacity="0.35"/>

    <!-- legs -->
    <rect class="leg-a" x="141" y="116" width="10" height="28" rx="3" fill="#2563eb"/>
    <rect class="leg-b" x="164" y="116" width="10" height="28" rx="3" fill="#1d4ed8"/>

    <!-- body -->
    <rect x="132" y="78" width="50" height="42" rx="8" fill="#38bdf8"/>
    <rect x="132" y="78" width="50" height="14" rx="6" fill="#0ea5e9"/>

    <!-- arms -->
    <rect class="arm-a" x="124" y="88" width="10" height="28" rx="4" fill="#f59e0b"/>
    <rect class="arm-b" x="181" y="89" width="10" height="28" rx="4" fill="#fbbf24"/>

    <!-- head -->
    <rect x="137" y="50" width="40" height="34" rx="8" fill="#fbbf24"/>
    <rect x="132" y="44" width="50" height="12" rx="4" fill="#ef4444"/>
    <rect x="166" y="55" width="8" height="8" rx="2" fill="#111827"/>
    <rect x="178" y="57" width="10" height="6" rx="2" fill="#ef4444"/>
  </g>
</svg>
