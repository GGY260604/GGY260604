<svg width="1000" height="86" viewBox="0 0 1000 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated profile tagline</title>
  <desc id="desc">Software Engineering Student, Full-Stack Learner, Backend and Database Builder moving from left to right in a loop.</desc>

  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="54%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <pattern id="scanlines" width="1000" height="8" patternUnits="userSpaceOnUse">
      <rect width="1000" height="1" fill="#ffffff" opacity="0.08"/>
    </pattern>


    <filter id="softGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .tagline {
      font-family: "Segoe UI", Inter, Arial, sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0;
      fill: url(#textGradient);
      filter: url(#softGlow);
      animation: moveText 10s ease-in-out infinite;
    }

    @keyframes moveText {
      0% { transform: translateX(-860px); }
      34% { transform: translateX(70px); }
      54% { transform: translateX(70px); }
      100% { transform: translateX(980px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tagline { animation: none; transform: translateX(70px); }
    }
  </style>

  <rect x="6" y="6" width="988" height="74" rx="16" fill="#020617" opacity="0.7"/>
  <rect x="10" y="8" width="980" height="70" rx="14" fill="url(#screen)"/>
  <rect x="10" y="8" width="980" height="70" rx="14" fill="url(#scanlines)"/>
  <rect x="10" y="8" width="980" height="70" rx="14" fill="none" stroke="url(#borderGlow)" stroke-width="3"/>
  <rect x="20" y="18" width="960" height="50" rx="9" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.28"/>
  <circle cx="36" cy="43" r="5" fill="#22c55e"/>
  <circle cx="964" cy="43" r="5" fill="#38bdf8"/>

  <svg x="20" y="18" width="960" height="50" viewBox="0 0 960 50" overflow="hidden">
    <text class="tagline" x="0" y="37" textLength="820" lengthAdjust="spacingAndGlyphs">Software Engineering Student | Full-Stack Learner | Backend &amp; Database Builder</text>
  </svg>

  <rect x="10" y="8" width="18" height="70" rx="8" fill="url(#screen)"/>
  <rect x="972" y="8" width="18" height="70" rx="8" fill="url(#screen)"/>
  <rect x="10" y="8" width="980" height="70" rx="14" fill="none" stroke="url(#borderGlow)" stroke-width="3"/>
  <rect x="20" y="18" width="960" height="50" rx="9" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.28"/>
  <circle cx="36" cy="43" r="5" fill="#22c55e"/>
  <circle cx="964" cy="43" r="5" fill="#38bdf8"/>
</svg>
